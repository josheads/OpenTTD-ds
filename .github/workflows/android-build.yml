name: OpenTTD Dual Screen (Android & Windows)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK (AYN Thor arm64-v8a)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-android
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja and ccache host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip ccache

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache CMake FetchContent dependency sources
        uses: actions/cache@v4
        with:
          path: deps-cache
          key: openttd-deps-src-v1-${{ runner.os }}-${{ hashFiles('cmake/FetchDualScreenDeps.cmake', 'scripts/populate_deps_cache.py') }}

      - name: Populate CMake dependency source cache
        run: |
          python3 scripts/populate_deps_cache.py --platform android --cache-dir deps-cache

      - name: Restore Android ccache
        uses: actions/cache@v4
        with:
          path: .ccache-android
          key: ccache-android-arm64-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-arm64-${{ github.sha }}-
            ccache-android-arm64-

      - name: Set up Android SDK, NDK r27, and CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT="${RUNNER_TEMP}/android-sdk"
            mkdir -p "${SDK_ROOT}"
          fi

          if [ ! -w "${SDK_ROOT}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${SDK_ROOT}"
          fi

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "$(ls -1d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done

          if [ -z "${SDKMANAGER}" ]; then
            echo "Bootstrapping Android command-line tools into ${SDK_ROOT}..."
            CMDLINE_ZIP="${RUNNER_TEMP}/commandlinetools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "${CMDLINE_ZIP}"
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q "${CMDLINE_ZIP}" -d "${RUNNER_TEMP}/cmdline-extract"
            rm -rf "${SDK_ROOT}/cmdline-tools/latest"
            mv "${RUNNER_TEMP}/cmdline-extract/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

          set +o pipefail
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null
          set -o pipefail

          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          set +o pipefail
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null
          set -o pipefail

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          validate-wrappers: false

      - name: Cache OpenGFX and OpenSFX archives
        uses: actions/cache@v4
        with:
          path: baseset-cache
          key: openttd-basesets-${{ hashFiles('scripts/fetch_basesets.py') }}

      - name: Build OpenTTD host tools (strgen, settingsgen)
        run: |
          ccache --zero-stats
          SDK_CMAKE="${ANDROID_HOME}/cmake/3.22.1/bin/cmake"
          CMAKE_BIN="$([ -x "${SDK_CMAKE}" ] && echo "${SDK_CMAKE}" || echo cmake)"
          "${CMAKE_BIN}" -S . -B build-tools -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_TOOLS_ONLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "${CMAKE_BIN}" --build build-tools --target tools -j "$(nproc)"
          test -f build-tools/strgen.cmake
          test -f build-tools/settingsgen.cmake

      - name: Generate OpenTTD runtime data (lang, baseset, ai, game)
        run: |
          SDK_CMAKE="${ANDROID_HOME}/cmake/3.22.1/bin/cmake"
          CMAKE_BIN="$([ -x "${SDK_CMAKE}" ] && echo "${SDK_CMAKE}" || echo cmake)"
          "${CMAKE_BIN}" -S . -B build-data -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_DEDICATED=ON \
            -DOPTION_FETCH_DEPS=OFF \
            -DHOST_BINARY_DIR="${GITHUB_WORKSPACE}/build-tools"
          "${CMAKE_BIN}" --build build-data \
            --target language_files baseset_files ai_compat_files gs_compat_files \
            -j "$(nproc)"

          DATA_DIR="android/app/src/main/assets/openttd_data"
          rm -rf "${DATA_DIR}"
          mkdir -p "${DATA_DIR}/lang" "${DATA_DIR}/baseset" "${DATA_DIR}/ai" "${DATA_DIR}/game"
          cp -r build-data/lang/. "${DATA_DIR}/lang/"
          cp -r build-data/baseset/. "${DATA_DIR}/baseset/"
          cp -r build-data/ai/. "${DATA_DIR}/ai/"
          cp -r build-data/game/. "${DATA_DIR}/game/"

      - name: Fetch OpenGFX and OpenSFX base sets
        run: |
          python3 scripts/fetch_basesets.py \
            --cache-dir baseset-cache \
            --output android/app/src/main/assets/openttd_data/baseset

      - name: Prepare optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
          fi

      - name: Build Android Debug and Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          LOG_FILE="${RUNNER_TEMP}/gradle-build.log"
          CCACHE_BIN="$(command -v ccache)"
          set +e
          gradle -p android :app:assembleDebug :app:assembleRelease \
            -PhostBinaryDir="${GITHUB_WORKSPACE}/build-tools" \
            -PndkVersion=27.2.12479018 \
            -PccacheExecutable="${CCACHE_BIN}" \
            -PdepsCacheDir="${GITHUB_WORKSPACE}/deps-cache" 2>&1 | tee "${LOG_FILE}"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            python3 -c '
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          def emit(title, body):
              if not body.strip():
                  return
              esc = body[:3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{esc}")
          idx = next((i for i, l in enumerate(lines) if "What went wrong:" in l or "FAILURE:" in l), max(0, len(lines) - 80))
          emit("Gradle What Went Wrong", "\n".join(lines[idx:]))
          pat = re.compile(r"(CMake Error|fatal error:|error:|FAILED|ld\.lld:|undefined symbol|CXX\d+)", re.I)
          ctx, seen = [], set()
          for i, l in enumerate(lines):
              if pat.search(l):
                  for j in range(max(0, i - 1), min(len(lines), i + 5)):
                      if j not in seen:
                          seen.add(j)
                          ctx.append(lines[j])
          emit("Android Native/Java Errors", "\n".join(ctx))
          ' "${LOG_FILE}"
            exit "${STATUS}"
          fi
          STATS="$(ccache --show-stats)"
          echo "${STATS}"
          ESC="${STATS//%/%25}"
          ESC="${ESC//$'\r'/%0D}"
          ESC="${ESC//$'\n'/%0A}"
          echo "::notice title=Android ccache stats::${ESC}"

      - name: Verify APK native libraries and runtime assets
        run: |
          for apk in \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk; do
            echo "Inspecting ${apk}..."
            test -f "${apk}"
            listing="$(unzip -Z1 "${apk}")"
            grep -qx "lib/arm64-v8a/libSDL3.so" <<< "${listing}"
            grep -qx "lib/arm64-v8a/libmain.so" <<< "${listing}"
            grep -qx "assets/openttd_data/lang/english.lng" <<< "${listing}"
            grep -qx "assets/openttd_data/baseset/openttd.grf" <<< "${listing}"
            grep -qx "assets/openttd_data/baseset/OpenTTD-Sans.ttf" <<< "${listing}"
            grep -q "assets/openttd_data/baseset/.*opengfx\.obg$" <<< "${listing}"
            grep -q "assets/openttd_data/baseset/.*opensfx\.obs$" <<< "${listing}"
            grep -q "^assets/openttd_data/ai/compat_" <<< "${listing}"
            grep -q "^assets/openttd_data/game/compat_" <<< "${listing}"
          done

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openttd-ds-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: openttd-ds-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-windows:
    name: Windows Dual-Screen Simulator & Tests
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache-windows
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ccache 4.10.2
        shell: bash
        run: |
          TEMP_WIN="$(cygpath -m "${RUNNER_TEMP}")"
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip" -o "${TEMP_WIN}/ccache.zip"
          unzip -q "${TEMP_WIN}/ccache.zip" -d "${TEMP_WIN}/ccache-dist"
          CCACHE_BIN_DIR="$(cd "${TEMP_WIN}/ccache-dist"/ccache-* && pwd -W)"
          echo "${CCACHE_BIN_DIR}" >> "${GITHUB_PATH}"

      - name: Configure MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache OpenGFX and OpenSFX archives
        uses: actions/cache@v4
        with:
          path: baseset-cache
          key: openttd-basesets-${{ hashFiles('scripts/fetch_basesets.py') }}

      - name: Cache CMake FetchContent dependency sources
        uses: actions/cache@v4
        with:
          path: deps-cache
          key: openttd-deps-src-v1-${{ runner.os }}-${{ hashFiles('cmake/FetchDualScreenDeps.cmake', 'scripts/populate_deps_cache.py') }}

      - name: Populate CMake dependency source cache
        shell: bash
        run: |
          python scripts/populate_deps_cache.py --platform windows --cache-dir deps-cache

      - name: Restore Windows ccache
        uses: actions/cache@v4
        with:
          path: .ccache-windows
          key: ccache-windows-x64-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-windows-x64-${{ github.sha }}-
            ccache-windows-x64-

      - name: Configure Windows dual-screen build
        shell: bash
        run: |
          ccache --zero-stats
          WORKSPACE_POSIX="${GITHUB_WORKSPACE//\\//}"
          CCACHE_POSIX="$(cygpath -m "$(command -v ccache)")"
          cmake -S . -B build-win -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_DUAL_SCREEN=ON \
            -DOPTION_FETCH_DEPS=ON \
            -DOPENTTD_DEPS_CACHE_DIR="${WORKSPACE_POSIX}/deps-cache" \
            -DCMAKE_C_COMPILER_LAUNCHER="${CCACHE_POSIX}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${CCACHE_POSIX}" \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build openttd and openttd_test
        shell: bash
        run: |
          LOG_FILE="$(cygpath -m "${RUNNER_TEMP}")/windows-build.log"
          set +e
          cmake --build build-win --target openttd openttd_test 2>&1 | tee "${LOG_FILE}"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            python -c '
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pat = re.compile(r"(fatal error|error [A-Z]+\d+:|FAILED:|ninja: error|LINK : fatal error)", re.I)
          ctx, seen = [], set()
          for i, l in enumerate(lines):
              if pat.search(l):
                  for j in range(max(0, i - 1), min(len(lines), i + 4)):
                      if j not in seen:
                          seen.add(j)
                          ctx.append(lines[j])
          body = "\n".join(ctx) if ctx else "\n".join(lines[-60:])
          esc = body[:3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Windows Build Failure::{esc}")
          ' "${LOG_FILE}"
            exit "${STATUS}"
          fi
          STATS="$(ccache --show-stats)"
          echo "${STATS}"
          ESC="${STATS//%/%25}"
          ESC="${ESC//$'\r'/%0D}"
          ESC="${ESC//$'\n'/%0A}"
          echo "::notice title=Windows ccache stats::${ESC}"

      - name: Fetch OpenGFX and OpenSFX base sets
        shell: bash
        run: |
          python scripts/fetch_basesets.py \
            --cache-dir baseset-cache \
            --output build-win/baseset

      - name: Run OpenTTD unit tests (openttd_test)
        shell: bash
        run: |
          ./build-win/openttd_test.exe --reporter console

      - name: Run headless dual-screen live smoke test
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build-win/openttd.exe -v "sdl_ds:smoke_test_frames=24,smoke_test_reconfigure=1" -s null -m null
